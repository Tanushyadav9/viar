name: CI - Full Verification & Regression Smoke Suite

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-smoke:
    name: Lint, Test, Boundary & Route Smoke Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Check code linting
        run: npm run lint

      - name: Run complete unit & regression test suite
        run: npm test

      - name: Build Next.js production bundle
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_APP_URL: 'http://localhost:3005'

      - name: Run public routes smoke test
        run: npm run test:smoke
        env:
          SMOKE_PORT: '3005'
