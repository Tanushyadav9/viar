name: CI - Full Verification & Regression Smoke Suite

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-smoke:
    name: Lint, Test, Boundary & Route Smoke Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NODE_ENV: test
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SITE_URL: 'http://localhost:3005'
      NEXT_PUBLIC_APP_URL: 'http://localhost:3005'
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: 'pk_live_Y2xlcmsudmlhci5pbiQ'
      CLERK_SECRET_KEY: 'sk_test_mock_clerk_secret_key_for_ci_pipeline'
      OWNER_EMAIL: 'aapkaastro1606@gmail.com'
      SUPERADMIN_EMAILS: 'aapkaastro1606@gmail.com'
      DATABASE_URL: 'postgresql://neondb_owner:npg_GU0YIPlXe3ia@ep-orange-poetry-b4cupwem.c-6.us-east-2.aws.neon.tech/neondb?sslmode=require'
      DIRECT_URL: 'postgresql://neondb_owner:npg_GU0YIPlXe3ia@ep-orange-poetry-b4cupwem.c-6.us-east-2.aws.neon.tech/neondb?sslmode=require'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Check code linting
        run: npm run lint

      - name: Run complete unit & regression test suite
        run: npm test
        env:
          DATABASE_URL: 'postgresql://mock:mock@localhost:5432/mock_test_db'
          DIRECT_URL: 'postgresql://mock:mock@localhost:5432/mock_test_db'

      - name: Build Next.js production bundle
        run: npm run build

      - name: Run public routes smoke test
        run: npm run test:smoke
        env:
          SMOKE_PORT: '3005'
