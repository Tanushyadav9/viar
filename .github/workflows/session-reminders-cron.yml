name: 1-on-1 Session Reminders & Email Outbox Dispatcher

on:
  schedule:
    # Run every 15 minutes around the clock (Vercel Hobby plan is daily-only, GitHub Actions provides 15-min cadence)
    - cron: '*/15 * * * *'
  workflow_dispatch:
    # Enables manual trigger from GitHub Actions Console

jobs:
  dispatch-reminders:
    name: Dispatch 24h/1h Session Reminders & Process Outbox
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger Session Reminders Protected Endpoint
        run: |
          TARGET_URL="${{ secrets.APP_URL || 'https://viar.in' }}/api/cron/session-reminders"
          echo "Calling protected reminders endpoint: $TARGET_URL"
          
          RESPONSE=$(curl -s -S -w "\nHTTP_STATUS:%{http_code}" -X POST "$TARGET_URL" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET || 'sec_cron_viar_reminders_88f2' }}" \
            -H "Content-Type: application/json")
          
          HTTP_BODY=$(echo "$RESPONSE" | sed -e '$d')
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1 | cut -d':' -f2)
          
          echo "Response Body: $HTTP_BODY"
          echo "HTTP Status: $HTTP_STATUS"
          
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Session reminder endpoint failed with status $HTTP_STATUS"
            exit 1
          fi
          
          echo "Session reminder cron executed successfully."
